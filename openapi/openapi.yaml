openapi: 3.0.0
info:
  title: API Spec
  version: 0.0.0
tags: []
paths: {}
components:
  schemas:
    Client.Request:
      type: object
      required:
        - id
        - type
        - token
      properties:
        id:
          type: string
          description: Unique request ID generated by the sender, e.g. a UUID string.
        type:
          $ref: '#/components/schemas/Client.RequestType'
        token:
          type: string
    Client.RequestType:
      type: string
      enum:
        - listProjects
        - createSession
        - attachSession
