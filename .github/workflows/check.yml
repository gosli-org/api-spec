name: Check API contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run generate
      - run: npm run check
      - name: Check committed generated files
        run: |
          git diff --exit-code -- TypeScript Go/api.gen.go openapi
          test -z "$(git ls-files --others --exclude-standard -- TypeScript Go/api.gen.go openapi)"
